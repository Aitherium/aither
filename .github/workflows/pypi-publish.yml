name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Moat guard (inspect built wheel + sdist)
        # Defense-in-depth: fail the publish if the built artifacts leak the
        # internal moat (adk/platform, adk/formbridge, adk/aither_bridge,
        # nanogpt, premium identities, or an aither_adk import) or drop the
        # licensing keystone. The sync gate checks the source payload; this
        # checks what actually gets uploaded.
        run: python scripts/check_moat_boundary.py
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
