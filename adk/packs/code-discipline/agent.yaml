# ============================================================================
# Code Discipline — Software Development Agent (gated)
# ============================================================================
# A coding-focused agent that applies the AitherOS gate discipline to every
# repo it works in: a defect becomes a CHECK (not a row), every check is
# self-tested and wired, and every code turn ends with a stated discharge
# ("checked, no new debt: <why>").
#
# ADK agents have no end-of-turn hook, so enforcement is IN-PROMPT (see
# brain_pack.yaml) plus the runnable bundled tools in tools/ — the agent is
# told to run them. That is the honest limit of the form factor: a human
# reading the closing message is the backstop.

name: code-discipline
identity: code-discipline
version: "1.0.0"
description: >
  Code Discipline is a software development agent that follows a measured gate
  discipline: defects become checks (with self-tests) not ledger rows, every
  check is wired unattended, and every code turn ends with a stated "checked,
  no new debt" discharge. Works in any language, any repo, any toolchain.

# Brain pack identity
brain_pack: code-discipline

# Capabilities this agent exercises (what it's allowed to do)
capabilities:
  - LLM_INFERENCE        # code generation and analysis
  - FILE_IO              # read and write source code
  - GIT_OPS              # git diff, status, blame, log
  - SUBPROCESS           # run tests, linters, the bundled checkers
  - SHELL_EXEC           # run the bundled check_checker_hygiene.py / next_debt_id.py
  - MEMORY_READ          # recall past debts and checks in this repo
  - MEMORY_WRITE         # record debt decisions and check history

# Tool domains this pack enables
enabled_domains:
  - code
  - testing
  - architecture
  - memory
