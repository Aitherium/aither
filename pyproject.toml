[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aither-adk"
version = "2.42.0"
description = "Build AI agents with real memory + faculties on any backend, local or cloud. Open-core: free local runtime with typed memory, knowledge graph, code graph and ReAct; paid tiers (portal.aitherium.com) unlock fleets, channels, reasoning and marketplace packs."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    { name = "Aitherium", email = "hello@aitherium.com" },
]
keywords = ["ai", "agents", "llm", "aither", "ollama", "openai", "anthropic", "vllm", "fleet", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.19.0",
    "qrcode>=7.4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.18.0"]
openai = ["openai>=1.0.0"]
graphs = [
    "numpy>=1.24.0",
]
embedding = [
    "sentence-transformers>=2.3.0",
    "torch>=2.0.0",
]
node = ["mcp>=1.0", "starlette>=0.36"]
pdf = ["pypdf>=4.0", "fpdf2>=2.7"]
# ARC world-model contribution: the bundled arc-brainpack pack registers/streams
# transitions with only core deps (httpx); PLAYING ARC to generate transitions
# (arc_contribute / `adk contribute play`) needs the real game client.
arc = ["arcengine>=0.9.3", "requests>=2.28.0"]
sync = ["watchdog>=3.0.0"]
federation = ["cryptography>=41.0.0"]
addons = ["docker>=7.0"]
workspace = [
    "aither-adk[platform]",
]
shell = [
    "rich>=13.0",
    "click>=8.0",
    "argcomplete>=3.0",
    # Command center + session browser TUIs, and live-session detection
    "prompt_toolkit>=3.0",
    "psutil>=5.9.0",
]
telegram = ["python-telegram-bot>=21.0"]
discord = ["discord.py>=2.3"]
slack = ["slack-bolt>=1.18"]
channels = [
    "aither-adk[telegram,discord,slack]",
]
voice-local = [
    "faster-whisper>=0.10.0",
    "piper-tts>=1.1.0",
]
voice-cloud = [
    "openai>=1.0.0",
    "deepgram-sdk>=3.0",
    "elevenlabs>=0.2",
]
voice = ["aither-adk[voice-local,voice-cloud]"]
all = [
    "aither-adk[graphs,embedding,channels,federation,sync,addons,node,shell,voice,pdf]",
    "anthropic>=0.18.0",
    "openai>=1.0.0",
]
platform = [
    # Internal platform toolkit dependencies (merged from aither-platform)
    "pydantic>=2.0.0",
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "prompt_toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "respx>=0.20.0",
    # Real coverage for pack-signature verification (pack_verifier degrades
    # gracefully without it, but then CI never exercises the verify path).
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://aitherium.com"
Repository = "https://github.com/Aitherium/aither-adk"
Documentation = "https://github.com/Aitherium/aither-adk#readme"

[project.scripts]
adk = "adk.cli:main"
adk-py = "adk.cli:main"
adk-serve = "adk.server:main"
adk-workspace = "adk.server:main_workspace"
adk-bug = "adk.bugreport:main"
adk-shell = "adk.shell.cli:entry"

[tool.hatch.build]
# Distribution-time moat boundary. These files exist in the source repo (the
# internal AitherOS runtime uses them) but are NEVER shipped in the published
# PyPI wheel. Same proven pattern used for premium identities.
#
#   - identities/*.yaml : only the free aither.yaml ships; the rest are
#                         premium IP delivered via pack download after purchase.
#   - nanogpt.py        : on-device training IP — competitors must not get a
#                         turnkey trainer in the free SDK.
exclude = [
    "adk/identities/*.yaml",
    "adk/nanogpt.py",
    "adk/formbridge/**",
    "adk/room_binaries/**",
    "adk/shell_binaries/**",
    "adk/faculties/memory_graph.py",
    "adk/platform/memory/**",
    "GRID_SETUP.md",
    "docker-compose.grid.yml",
    "tests/test_formbridge.py",
]
artifacts = [
    "adk/identities/aither.yaml",
    # Bundled tool packs (arc-brainpack, deep_research, cloudflare): force-include
    # their non-.py assets — the .toolpack.yaml manifests (dotfiles), pack UIs and
    # skill markdown — so a `pip install aither-adk` ships working, discoverable packs.
    "adk/toolpacks/**/*",
    # Swappable agent UI packs (built-ins: llamacpp, …). `adk ui set <name>`
    # selects one; a custom pack is a folder with index.html dropped into
    # ~/.aither/ui-packs/. Ship the built-ins inside the wheel.
    "adk/webui/packs/**/*",
    # Vendored ODS model catalog and hardware database (deterministic model resolution).
    # JSON files needed at runtime by adk.ods.resolver; force-include via importlib.resources.
    "adk/ods/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["adk"]
[tool.hatch.build.targets.wheel.force-include]
"docker-compose.adk-vllm.yml" = "adk/docker-compose.adk-vllm.yml"
"agent.yaml" = "adk/workspace-agent.yaml"
# Built-in admin/settings web console served by aither-serve at / and /ui.
"adk/webui/index.html" = "adk/webui/index.html"
# Pack-UI bridge SDK served at /packs/_sdk.js for sandboxed pack iframes.
"adk/webui/pack_sdk.js" = "adk/webui/pack_sdk.js"
# Bundled self-service deploy compose files (adk deploy node, both the default
# ADK-native path and --genesis full-stack path, each with a --federate profile) —
# ship versioned inside the package so `adk deploy node` needs no network fetch from
# the private AitherOS monorepo for its own config, only for the (public) GHCR pull.
"deploy/compose/docker-compose.node.yml" = "adk/deploy/compose/docker-compose.node.yml"
"deploy/compose/docker-compose.node-adk.yml" = "adk/deploy/compose/docker-compose.node-adk.yml"

[tool.hatch.build.targets.wheel.targets.data]
"adk/packs" = "adk/packs"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # IRC event handlers use ensure_future for async broadcast — harmless in tests
    "ignore:coroutine 'IRCServer._broadcast_to_channel' was never awaited:RuntimeWarning",
    "ignore:coroutine 'IRCServer._send_to_nick' was never awaited:RuntimeWarning",
    # CPython unittest.mock bug: AsyncMock child creation creates unawaited coroutines
    # https://github.com/python/cpython/issues/100226
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]

[tool.ruff]
# aither-adk is a published, pip-distributed SDK that also lives inside the
# AitherOS monorepo. Without a local config it inherited the repo-root ruff
# config but NONE of the per-file-ignores AitherOS grants its own code — holding
# the SDK to a STRICTER bar than the platform itself (1900+ false-positives).
# This restores parity with the platform's pragmatic standard: real correctness
# (E/F/W) is enforced; intentional SDK style (camelCase A2A/protocol fields,
# acronym import aliases, __init__ star re-exports, docstring whitespace) is
# accepted. Genuine bugs — undefined names (F821/F822) and parse errors — are
# deliberately KEPT so regressions surface.
line-length = 100
target-version = "py312"
extend-exclude = ["examples", "install.py", "install.ps1", "setup-vllm.py", "packaging", "scripts"]

[tool.ruff.lint]
# N (pep8-naming) intentionally NOT selected: the SDK uses camelCase wire-format
# fields for protocol compat and short acronym aliases by design.
select = ["E", "F", "W", "I"]
ignore = [
    "E501", "E402", "E701", "E702", "E731", "E741",
    "F401", "F403", "F405", "F541", "F811", "F841",
    "I001", "W291", "W293",
]
