[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aither-adk"
version = "1.9.0"
description = "Build AI agent fleets. Any backend, local or cloud. Runtime backend switching, hybrid reasoning, effort-based routing, 17 bundled identities, knowledge graph memory."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    { name = "Aitherium", email = "hello@aitherium.com" },
]
keywords = ["ai", "agents", "llm", "aither", "ollama", "openai", "anthropic", "vllm", "fleet", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.18.0"]
openai = ["openai>=1.0.0"]
graphs = [
    "numpy>=1.24.0",
]
embedding = [
    "sentence-transformers>=2.3.0",
    "torch>=2.0.0",
]
sync = ["watchdog>=3.0.0"]
federation = ["cryptography>=41.0.0"]
telegram = ["python-telegram-bot>=21.0"]
discord = ["discord.py>=2.3"]
slack = ["slack-bolt>=1.18"]
channels = [
    "aither-adk[telegram,discord,slack]",
]
all = [
    "aither-adk[graphs,embedding,channels,federation,sync]",
    "anthropic>=0.18.0",
    "openai>=1.0.0",
]
platform = [
    # Internal platform toolkit dependencies (merged from aither-platform)
    "pydantic>=2.0.0",
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "prompt_toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "respx>=0.20.0",
]

[project.urls]
Homepage = "https://aitherium.com"
Repository = "https://github.com/Aitherium/aither"
Documentation = "https://github.com/Aitherium/aither#readme"

[project.scripts]
# `aither` command owned by aithershell package
adk = "adk.cli:main"
aithershell = "adk.cli:main"
adk-serve = "adk.server:main"
adk-bug = "adk.bugreport:main"

[tool.hatch.build.targets.wheel]
packages = ["adk"]

[tool.hatch.build.targets.wheel.force-include]
"docker-compose.adk-vllm.yml" = "adk/docker-compose.adk-vllm.yml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # IRC event handlers use ensure_future for async broadcast — harmless in tests
    "ignore:coroutine 'IRCServer._broadcast_to_channel' was never awaited:RuntimeWarning",
    "ignore:coroutine 'IRCServer._send_to_nick' was never awaited:RuntimeWarning",
    # CPython unittest.mock bug: AsyncMock child creation creates unawaited coroutines
    # https://github.com/python/cpython/issues/100226
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]
