# Saga Iris Addon — AI art and 3D model generation
# Install: pip install saga-iris
# Requires: GPU with 6+ GB VRAM, ComfyUI or local Stable Diffusion
#
# Generates character portraits, location art, item illustrations,
# maps, and 3D character models. Integrates with Saga's StoryGraph
# to auto-generate art from node descriptions.

name: saga-iris
version: "1.0.0"
description: >-
  AI art generation — character portraits, location paintings, item
  illustrations, world maps, and 3D model generation. Powered by
  ComfyUI/Stable Diffusion with LoRA adapters for style consistency.

category: art
author: Aitherium
free: false
price: 30.0

# Additional tool modules
tool_modules:
  - "saga_iris.tools.portrait"        # generate_portrait(character_name)
  - "saga_iris.tools.scene_art"       # generate_scene(location_name)
  - "saga_iris.tools.item_art"        # generate_item_art(item_name)
  - "saga_iris.tools.map_gen"         # generate_map(world_name)
  - "saga_iris.tools.model_3d"        # generate_3d_model(character_name)

server_routers:
  - "saga_iris.routers:iris_router"

ui_panels:
  - "saga_iris.panels:ArtGalleryPanel"
  - "saga_iris.panels:StyleEditorPanel"

requires:
  - torch>=2.0
  - diffusers>=0.28
  - safetensors
  - Pillow

requires_gpu: true
min_vram_gb: 6
