# Saga Prometheus Addon — Full world simulation backend
# Install: pip install saga-prometheus
# Or: copy this file to ~/.saga/addons/ and install the module manually
#
# When installed, Saga's SimulationClient auto-detects Prometheus and
# routes all simulation calls through it instead of the local fallback.
# Every world_tick, faction_turn, and NPC decision uses the real
# 39-system simulation engine with MCTS, weather Markov chains,
# NPC lifecycle, economy, governance, and combat.

name: saga-prometheus
version: "1.0.0"
description: >-
  Full Prometheus world simulation — 39 game systems, MCTS faction AI,
  NPC lifecycle, weather Markov chains, economy, governance, combat.
  Replaces the local simulation fallback with a real simulation engine.

category: simulation
author: Aitherium
free: true
price: 0.0

# The simulation backend class to register
simulation_backend: "saga_prometheus.backend:PrometheusSimBackend"

# Additional API routers to mount on the Saga server
server_routers:
  - "saga_prometheus.routers:prometheus_router"

# Additional tool modules to register
tool_modules:
  - "saga_prometheus.tools.world_bootstrap"
  - "saga_prometheus.tools.citizen_control"
  - "saga_prometheus.tools.governance"

requires:
  - httpx>=0.27.0

requires_gpu: false
min_vram_gb: 0
