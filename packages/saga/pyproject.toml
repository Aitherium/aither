[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aither-saga"
version = "1.0.0"
description = "AI-Powered Interactive Storytelling Engine — world-building, RPG mechanics, branching narratives, and simulation-backed living worlds."
readme = "README.md"
license = {text = "Proprietary — Aitherium Ltd"}
requires-python = ">=3.10"
authors = [{name = "Aitherium", email = "saga@aitherium.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Artistic Software",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "aither-adk>=1.0.0",
    "pydantic>=2.0",
    "uvicorn>=0.27.0",
    "fastapi>=0.109.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
saga = "cli:main"

[project.entry-points."saga.addons"]
# Built-in addons register here. Third-party addons add their own entry points.
# Format: addon_name = "module:AddonClass"
# e.g. prometheus = "saga_prometheus:PrometheusAddon"
# e.g. iris = "saga_iris:IrisAddon"

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.3.0", "torch>=2.0"]
desktop = ["pyinstaller>=6.0"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["saga_engine*", "tools*", "prompts*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.md"]
