name: saga
version: "1.0.0"
description: >-
  Saga — AI-powered interactive storytelling engine with world-building,
  RPG mechanics, branching narratives, and glass-box context assembly.
  A standalone creative writing and roleplaying companion.

identity: identity.yaml

llm:
  provider: ollama
  model: nemotron-orchestrator-8b
  fallback_model: gemma4:4b

cognitive:
  sase: true
  mcts: true
  prism: true
  council: false
  goals: false
  intent: true
  crystallization: true

tools:
  # Core narrative loop (MUST use every turn)
  - tools/story_turn.py          # process_story_turn, after_story_turn, store_story_memory

  # World graph CRUD
  - tools/character_manage.py    # create/list/update characters
  - tools/world_manage.py        # locations, factions, lore, relationships, world_state
  - tools/inventory.py           # items, give, list_inventory

  # Memory (all tiers)
  - tools/memory_manage.py       # recall, pin, unpin, promote, demote, consolidate, stats
  - tools/story_revise.py        # delete/revise/retcon with propagation

  # Reasoning & planning
  - tools/reasoning.py           # think_deeply, evaluate_branches, check_consistency
  - tools/structure.py           # outline, plot_twists, pacing, foreshadow, transitions

  # Character depth
  - tools/character_tools.py     # interview, arc_plan, dialogue_style, motivation, npc_gen

  # World-building
  - tools/worldcraft.py          # faction_politics, magic_system, calendar, culture, history

  # Game mechanics
  - tools/dice_roll.py           # roll_dice, roll_multiple
  - tools/mechanics.py           # combat, skill_checks, level_up, quests, loot, dungeons

  # Style & configuration
  - tools/style_tools.py         # set_genre, set_voice, set_prose, add_lore_rule

  # Editorial
  - tools/editorial.py           # continuity_audit, style_metrics, rewrite, expand, show_dont_tell

  # Autonomous characters
  - tools/autonomous.py          # diary, offscreen_events, character_react, faction_turn, world_tick

  # Save/export
  - tools/save_load.py           # save/load/branch/list projects
  - tools/export_story.py        # basic export (markdown, json, sillytavern)
  - tools/publish.py             # manuscript, epub, foundry, audiobook, covers, wiki

deployment:
  port: 8080
  sovereign: false

metadata:
  product: true
  price: 60.00
  currency: USD
  category: creative
  tags:
    - storytelling
    - rpg
    - worldbuilding
    - interactive-fiction
    - creative-writing
